name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://clinicore:local@localhost:5432/clinicore
      PORT: "3333"
      NODE_ENV: test
      APP_ORIGIN: http://localhost:3000
      API_URL: http://localhost:3333
      ALLOWED_ORIGINS: http://localhost:3000
      TRUSTED_PROXIES: 10.0.0.0/8
      LOG_LEVEL: silent
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: a-ci-jwt-secret-with-at-least-32-characters
      GOOGLE_CLIENT_ID: ci-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ci@clinicore.com.br
      SMTP_PASSWORD: ci-smtp-password
      MAIL_FROM: ci@clinicore.com.br
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: clinicore
          POSTGRES_PASSWORD: local
          POSTGRES_DB: clinicore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinicore -d clinicore"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run migration:run
      - name: schema matches the entities
        run: npm run migration:generate -- --check "$RUNNER_TEMP/Drift"
      - run: npm run test
      - run: npm run test:e2e

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck
      - name: prerendered html has the landing content
        run: grep -Eq '<h1[^>]*>Clinicore</h1>' .next/server/app/index.html
      - name: no test gate until apps/site has logic to test
        run: "true"
