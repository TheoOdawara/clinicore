name: CI

on:
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://clinicore:local@localhost:5432/clinicore
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: clinicore
          POSTGRES_PASSWORD: local
          POSTGRES_DB: clinicore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinicore -d clinicore"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.10.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          rust-src-dir: apps/api
          cache-workspaces: apps/api
      - uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-nextest@0.9.149,cargo-llvm-cov@0.9.1,cargo-deny@0.20.2
      - run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls
      - run: cargo fmt --check
      - run: cargo deny check
      - run: sqlx migrate run
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo sqlx prepare --workspace --check
      - run: cargo llvm-cov nextest --fail-under-lines 100 --fail-under-functions 100 --fail-under-regions 100

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build
        env:
          VITE_API_URL: http://localhost:3333
      - run: bun check
      - run: bun run test

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build
      - run: bun check
      - run: bun run test
      - name: prerendered html has the landing content
        run: grep -Eq '<h1[^>]*>Clinicore</h1>' .next/server/app/index.html

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: install osv-scanner 2.7.0
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: osv-scanner scan source --lockfile=pubspec.lock
      - run: flutter pub get --enforce-lockfile
      - run: dart pub global activate very_good_cli 1.5.0
      - run: flutter analyze --fatal-infos
      - run: dart format --output=none --set-exit-if-changed .
      - run: very_good test --coverage --min-coverage 100 --collect-coverage-from=all --test-randomize-ordering-seed random
