name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  api-rs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-rs
    env:
      DATABASE_URL: postgresql://clinicore:local@localhost:5432/clinicore
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: clinicore
          POSTGRES_PASSWORD: local
          POSTGRES_DB: clinicore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinicore -d clinicore"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rust-src-dir: apps/api-rs
          cache-workspaces: apps/api-rs
      - run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: sqlx migrate run
      - run: cargo sqlx prepare --workspace --check
      - run: cargo test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck
      - name: prerendered html has the landing content
        run: grep -Eq '<h1[^>]*>Clinicore</h1>' .next/server/app/index.html
      - name: no test gate until apps/site has logic to test
        run: "true"

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --fatal-infos
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter test
