name: ci-web

on:
  pull_request:
    branches: [staging, main]
    paths:
      - apps/web/**
      - .github/workflows/ci-web.yml
  push:
    branches: [staging]
    paths:
      - apps/web/**
      - .github/workflows/ci-web.yml

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            lock:
              - apps/web/bun.lock
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock') }}
      - id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock') }}
      - if: github.event_name == 'pull_request'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install
        run: bun install --frozen-lockfile

      - name: Known vulnerabilities (bun audit)
        if: github.event_name != 'pull_request' || github.base_ref == 'main' || steps.filter.outputs.lock == 'true'
        run: bun run audit
      - name: Format (prettier)
        run: bunx prettier --check .
      - name: Lint (eslint)
        run: bun run lint
      - name: Types of the config and e2e files
        run: bun run typecheck
      - name: Architecture boundaries
        run: bun run test:boundaries
      - name: Build
        run: bun run build
      - name: Unit tests with coverage
        run: bun run test -- --coverage --watch=false
      - name: Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: End-to-end over the build (playwright)
        run: bun run e2e
      - name: Coverage of new lines (90%, and 100% on critical paths)
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          report=apps/web/coverage/web/lcov.info
          uvx diff-cover==11.0.3 "$report" --compare-branch "$BASE" --fail-under 90
          uvx diff-cover==11.0.3 "$report" --compare-branch "$BASE" --fail-under 100 --include \
            'apps/web/src/app/core/http/**' \
            'apps/web/src/app/core/session/**' \
            'apps/web/src/app/core/config/**'

      - if: github.ref == 'refs/heads/staging' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock') }}
      - if: github.ref == 'refs/heads/staging' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock') }}
