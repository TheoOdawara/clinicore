[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
clinicore-core = { path = "crates/core" }
argon2 = "=0.6.0"
askama = { version = "=0.16.1", default-features = false, features = ["derive", "std"] }
base64 = "=0.23.1"
croner = { version = "=5.0.1", default-features = false, features = ["std", "jiff"] }
email_address = "=0.2.10"
hmac = "=0.13.0"
jiff = { version = "=1.0.3", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
lettre = { version = "=0.11.24", default-features = false, features = ["builder", "smtp-transport", "pool", "tokio1", "tokio1-rustls-tls"] }
rand = "=0.10.4"
sha2 = "=0.11.1"
subtle = "=2.6.1"
unicode-normalization = "=0.1.26"
uuid = { version = "=1.29.3", features = ["serde"] }
axum = "=0.8.9"
http-body-util = "=0.1.5"
redis = { version = "=1.8.2", default-features = false, features = ["tokio-comp", "connection-manager"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sqlx = { version = "=0.9.1", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros", "uuid"] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["trace", "catch-panic", "cors", "set-header"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json", "fmt"] }
utoipa = "=6.0.0"
utoipa-axum = "=0.3.0"
utoipa-swagger-ui = { version = "=10.0.2", features = ["axum", "vendored"] }

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
