name: clinicore
description: Clinicore mobile app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  dio: 5.11.1
  go_router: 18.0.1
  json_annotation: 4.12.0
  retrofit: 4.10.0

dev_dependencies:
  build_runner: 2.16.1
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: 6.14.1
  retrofit_generator: 10.2.11
  swagger_parser: 1.44.3

flutter:
  uses-material-design: true

swagger_parser:
  schema_url: http://localhost:3333/api-json
  output_directory: lib/shared/api
  json_serializer: json_serializable
