<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body style="margin:0;padding:24px;font-family:Arial,sans-serif;font-size:16px;line-height:1.5;color:#1f2937">
    <p>Olá, {{ content.name }}.</p>
    {%- for paragraph in content.paragraphs %}
    <p>{{ paragraph }}</p>
    {%- endfor %}
    <p>
      <a
        href="{{ content.link }}"
        style="display:inline-block;padding:12px 20px;background:#0f766e;color:#ffffff;border-radius:6px;text-decoration:none"
      >{{ content.action }}</a>
    </p>
    <p style="font-size:14px;color:#6b7280">Se o botão não abrir, copie este link no navegador:<br>{{ content.link }}</p>
  </body>
</html>
