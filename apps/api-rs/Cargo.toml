[workspace]
resolver = "3"
members = ["crates/app", "crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
clinicore-core = { path = "crates/core" }
argon2 = "0.6.0"
askama = "0.16.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
axum-client-ip = { version = "1.3.1", default-features = false, features = ["connect-info"] }
base64 = "0.23.1"
cookie = "0.18.2"
email_address = "0.2.9"
getrandom = "0.4.3"
hex = "0.4.3"
http-body-util = "0.1.5"
ipnet = "2.12.2"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls", "builder", "smtp-transport", "ring", "rustls-native-certs"] }
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate", "uuid", "ipnet"] }
thiserror = "2.0.21"
tokio = "1.53.1"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "catch-panic", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["serde"] }
utoipa = { version = "6.0.0", features = ["uuid"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum", "vendored"] }
validator = { version = "0.21.0", features = ["derive"] }
